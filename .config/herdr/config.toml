# Herdr 终端工作区管理器配置（替代 tmux）
# 文档: https://herdr.dev
# 校验: herdr config check

# 跳过首次运行引导
onboarding = false

[terminal]
# 新面板默认使用 zsh
default_shell = "zsh"
# macOS 下用 login shell 以加载 Homebrew PATH（其他平台保持非 login）
shell_mode = "auto"

[ui]
# 使用外层终端（Windows Terminal）的原生光标，让 zsh-vi-mode 的
# 插入模式细线光标（\e[5 q）能真正生效。
# 默认 "auto" 在 WSL 上会由 herdr 自己画方块光标，导致无法显示细线。
host_cursor = "native"

[keys]
# 默认 prefix 就是 ctrl+b（与 tmux 一致），无需额外设置。
split_vertical = "prefix+\\"
split_horizontal = "prefix+-"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
new_tab = "prefix+c"
next_tab = "prefix+n"
previous_tab = "prefix+p"
close_tab = "prefix+x"
rename_tab = "prefix+r"
new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+shift+x"
detach = "prefix+q"
